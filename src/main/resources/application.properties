spring.application.name=agriapp
spring.profiles.active=dev

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.data.jpa.repositories.enabled=true

## Τα ονόματα πινάκων και στηλών γράφονται σε quotes. Χρειάζεται επειδή το
## "users" είναι δεσμευμένη λέξη σε αρκετές βάσεις.
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

## false = το session κλείνει με το που τελειώσει το transaction.
## Υποχρεωτικό για REST API: αποτρέπει lazy loading κατά τη σειριοποίηση σε
## JSON, που θα εκτελούσε queries αφού έχει φύγει ο έλεγχος από το service.
spring.jpa.open-in-view=false
